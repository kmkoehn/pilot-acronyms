# Cloud builds for the iPhone app. Codemagic reads this file from the GitHub repository.
#
#   ios-simulator-preview  Builds for the iOS simulator and saves light and dark screenshots.
#                          Needs no Apple account, so it can run right away.
#   ios-testflight         Signs the app and uploads it to TestFlight. Needs the Apple setup
#                          described in README.md.
workflows:
  ios-simulator-preview:
    name: iOS simulator preview
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      node: 22
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build the web files and copy them into the iPhone project
        script: |
          npm run web
          npx cap sync ios
      - name: Build for the iOS simulator
        script: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/derived CODE_SIGNING_ALLOWED=NO build
      - name: Open the app in a simulator and take screenshots
        script: |
          set -e
          mkdir -p build/screenshots
          APP=$(find build/derived/Build/Products -maxdepth 2 -name "App.app" | head -1)
          ID=com.kmkoehn.pilotacronyms
          # Prints the newest simulator whose name starts with $1, preferring names that match $2.
          pick() {
            xcrun simctl list devices available -j | KIND="$1" PREFER="$2" node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                const all = Object.entries(JSON.parse(s).devices)
                  .filter(([runtime]) => runtime.includes("iOS"))
                  .sort(([a], [b]) => a.localeCompare(b, undefined, { numeric: true }));
                const list = all.flatMap(([, l]) => l).filter(d => d.name.startsWith(process.env.KIND));
                const pick = list.filter(d => new RegExp(process.env.PREFER).test(d.name)).pop() || list.pop();
                console.log(pick.udid);
              });'
          }
          # Boots a simulator, installs the app, and saves light and dark screenshots named after $2.
          shoot_device() {
            UDID="$1"
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100
            xcrun simctl install "$UDID" "$APP"
            # The first launch on a fresh simulator is slow, so open the app once before taking screenshots.
            xcrun simctl launch "$UDID" $ID
            sleep 20
            xcrun simctl terminate "$UDID" $ID || true
            for mode in light dark; do
              xcrun simctl ui "$UDID" appearance $mode
              xcrun simctl launch "$UDID" $ID
              sleep 12
              xcrun simctl io "$UDID" screenshot "build/screenshots/$2-$mode.png"
              xcrun simctl terminate "$UDID" $ID || true
            done
            xcrun simctl shutdown "$UDID"
          }
          shoot_device "$(pick iPhone ' Pro$')" iphone
          shoot_device "$(pick iPad '13-inch')" ipad
    artifacts:
      - build/screenshots/*.png

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Pilot Acronyms # The name you give the App Store Connect API key in Codemagic
    environment:
      xcode: latest
      node: 22
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kmkoehn.pilotacronyms
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build the web files and copy them into the iPhone project
        script: |
          npm run web
          npx cap sync ios
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Set the version and build number
        script: |
          # Version comes from package.json; the build number is Codemagic's, which rises every build.
          VERSION=$(node -p "require('./package.json').version")
          sed -i '' -E \
            -e "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/" \
            -e "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" \
            ios/App/App.xcodeproj/project.pbxproj
      - name: Build the signed app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testers get each build automatically; external beta review
        # would need beta review contact details filled in on App Store Connect first.
        submit_to_testflight: false
